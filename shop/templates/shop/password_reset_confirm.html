<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <title>ตั้งรหัสผ่านใหม่</title>
    <style>
    body {
        font-family: sans-serif;
        background-color: #f4f4f9;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }
    
    /* ซ่อนข้อความช่วยเหลือและเงื่อนไขเริ่มต้นของ Django ในฟอร์ม */
    form ul, form .helptext, form small {
        display: none;
    }

    /* ยกเว้น: ให้แสดงเฉพาะข้อความ Error (แจ้งเตือนเมื่อกรอกผิดเงื่อนไข) เป็นสีแดง */
    form .errorlist {
        display: block !important;
        color: red;
        list-style-type: none;
        padding-left: 0;
        font-size: 13px;
        margin: 5px 0 0 0;
    }
</style>
</head>

<body>
    <div
        style="background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 380px;">
        <h2 style="text-align: center; color: #333; margin-top: 0;">ตั้งรหัสผ่านใหม่</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit"
                style="width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px;">เปลี่ยนรหัสผ่าน</button>
        </form>
    </div>
</body>

</html>
