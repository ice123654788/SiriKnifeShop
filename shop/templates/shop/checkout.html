<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <title>1. ข้อมูลการจัดส่ง</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            width: 400px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
            color: #555;
        }

        input,
        textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        textarea {
            height: 80px;
            resize: vertical;
        }

        .total-box {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            text-align: right;
            font-weight: bold;
            color: #e44d26;
            margin-bottom: 15px;
        }

        .btn {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #218838;
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>ที่อยู่จัดส่งสินค้า</h2>
        <div class="total-box">ยอดชำระรวม: ฿{{ total_price }}</div>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>ชื่อ-นามสกุลผู้รับ:</label>
                <input type="text" name="full_name" required>
            </div>
            <div class="form-group">
                <label>ที่อยู่จัดส่ง:</label>
                <textarea name="address" required></textarea>
            </div>
            <div class="form-group">
                <label>เบอร์โทรศัพท์:</label>
                <input type="text" name="phone" required>
            </div>
            <button type="submit" class="btn">ดำเนินการต่อ (ชำระเงิน)</button>
        </form>
    </div>
</body>

</html>
