<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <title>เข้าสู่ระบบ</title>
    <style>
        /* จัดการกล่องข้อความแจ้งเตือนข้อผิดพลาด */
        .errorlist {
            color: #dc3545;
            /* เปลี่ยนตัวหนังสือเป็นสีแดง */
            list-style-type: none;
            /* เอาจุด Bullet ออก */
            padding: 0;
            /* ลบระยะขอบซ้าย */
            margin: 5px 0 0 0;
            font-size: 13px;
        }

        .errorlist li {
            margin-bottom: 3px;
        }
    </style>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            width: 350px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
        }

        form p {
            margin-bottom: 15px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .btn {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .link a {
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>เข้าสู่ระบบ</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">เข้าสู่ระบบ</button>
        </form>
        <div class="link">
            ยังไม่มีบัญชี? <a href="{% url 'register_view' %}">สมัครสมาชิก</a>
            <div class="link" style="margin-top: 10px;">
                <a href="{% url 'password_reset' %}" style="font-size: 13px;">ลืมรหัสผ่าน?</a>
            </div>
        </div>
    </div>
</body>

</html>
